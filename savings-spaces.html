<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay — Savings Spaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #F2F1F5;
    --card:         rgba(255,255,255,0.94);
    --silver:       #C0C4CC;
    --silver-dark:  #9A9EA8;
    --hero-from:    #3A3D45;
    --hero-mid:     #52555E;
    --hero-to:      #6E1B4D;
    --magenta:      #D6006E;
    --magenta-dark: #A0004F;
    --magenta-light:#FCE4F0;
    --text:         #1D1E24;
    --muted:        #777985;
    --border:       #E5E2E9;
    --ok:           #00A86B;
    --err:          #E8425A;
    --shadow:       0 12px 34px rgba(43,30,49,0.09);
    --r:            22px;
    --r-sm:         12px;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(ellipse at 8% 0%, rgba(214,0,110,0.07), transparent 34rem),
      linear-gradient(180deg, #F8F7FA 0%, var(--bg) 55%, #ECEBF0 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── HEADER ─────────────────────────────── */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.88);
    border-bottom: 1px solid rgba(226,227,232,0.8);
    height: 68px;
    padding: 0 max(24px, calc((100vw - 1040px) / 2));
    backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .app-logo {
    font-size: 1.2em;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--magenta);
  }
  .app-logo span { color: var(--text); }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--magenta), var(--silver-dark));
    color: white;
    font-size: 0.75em;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── MAIN ───────────────────────────────── */
  .main {
    max-width: 920px;
    margin: 0 auto;
    padding: 26px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ── MAIN BALANCE HERO ──────────────────── */
  .balance-hero {
    background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-mid) 45%, var(--hero-to) 100%);
    border-radius: var(--r);
    padding: 34px 36px;
    color: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 44px rgba(44,25,48,0.18), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .balance-hero::before {
    content: '';
    position: absolute; top: -70px; right: -50px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: rgba(214,0,110,0.25);
    pointer-events: none;
  }
  .balance-hero::after {
    content: '';
    position: absolute; bottom: -90px; left: 30px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(192,196,204,0.15);
    pointer-events: none;
  }
  .balance-eyebrow {
    font-size: 0.7em;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-bottom: 10px;
    position: relative; z-index: 1;
  }
  .balance-amount {
    font-size: clamp(2.4em, 7vw, 3.25em);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: #FFFFFF;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
    position: relative; z-index: 1;
  }
  .balance-sub {
    font-size: 0.82em;
    color: rgba(255,255,255,0.6);
    position: relative; z-index: 1;
  }

  /* ── HEADER ROW FOR SPACES ──────────────── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title {
    font-size: 1.2em;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .btn-new {
    background: var(--magenta);
    color: white;
    border: none;
    border-radius: 100px;
    padding: 9px 18px;
    font-size: 0.82em;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(214,0,110,0.35);
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-new:hover { opacity: 0.92; }
  .btn-new:active { transform: scale(0.97); }

  /* ── SPACES GRID ────────────────────────── */
  .spaces-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 560px) {
    .spaces-grid { grid-template-columns: 1fr; }
  }

  .space-card {
    background: var(--card);
    border-radius: var(--r);
    padding: 22px;
    box-shadow: 0 10px 30px rgba(43,30,49,0.07), inset 0 1px 0 rgba(255,255,255,0.9);
    border: 1px solid rgba(226,223,232,0.9);
    position: relative;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .space-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(30,20,30,0.14);
  }
  .space-card.goal-met {
    border: 1px solid var(--magenta);
  }

  .space-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .space-heading { min-width: 0; flex: 1; }
  .space-actions { display: flex; gap: 6px; }
  .space-action {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    border-radius: 9px;
    padding: 6px 9px;
    font-size: 0.72em;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .space-action:hover { color: var(--magenta-dark); border-color: var(--magenta); background: var(--magenta-light); }
  .space-action.delete:hover { color: var(--err); border-color: var(--err); background: #FFF0F1; }
  .space-emoji {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(145deg, #FFF0F7 0%, #E5E2EA 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4em;
    flex-shrink: 0;
  }
  .space-name {
    font-size: 0.98em;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .space-detail {
    font-size: 0.75em;
    color: var(--muted);
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .space-amounts {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .space-current {
    font-size: 1.22em;
    font-weight: 800;
    color: var(--magenta-dark);
    font-variant-numeric: tabular-nums;
  }
  .space-target {
    font-size: 0.78em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    width: 100%;
    height: 10px;
    border-radius: 100px;
    background: #ECEAF0;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, #B9BBC5 0%, #E14691 58%, var(--magenta) 100%);
    box-shadow: 0 1px 8px rgba(214,0,110,0.22);
    transition: width 0.4s ease;
  }

  .space-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.72em;
    color: var(--muted);
  }
  .space-pct {
    font-weight: 700;
    color: var(--magenta-dark);
  }
  .space-badge {
    font-size: 0.68em;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 100px;
    background: var(--magenta-light);
    color: var(--magenta-dark);
  }
  .space-badge.overdue {
    background: #FFECEC;
    color: var(--err);
  }
  .space-badge.done {
    background: #E4F9EF;
    color: var(--ok);
  }

  .space-monthly {
    font-size: 0.72em;
    color: var(--muted);
    margin-top: 4px;
  }
  .space-monthly b { color: var(--magenta-dark); }

  /* ── TOASTS ─────────────────────────────── */
  .toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 2000;
    width: min(360px, calc(100vw - 32px));
    pointer-events: none;
  }
  .toast {
    padding: 13px 18px;
    border-radius: var(--r-sm);
    font-size: 0.85em;
    font-weight: 600;
    color: white;
    box-shadow: 0 10px 28px rgba(20,10,25,0.25);
    animation: toastIn 0.25s ease, toastOut 0.25s ease 2.6s forwards;
    background: var(--text);
    text-align: center;
  }
  .toast.ok   { background: var(--ok); }
  .toast.err  { background: var(--err); }
  .toast.info { background: var(--magenta-dark); }
  @keyframes toastIn {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @keyframes toastOut {
    to { transform: translateY(-10px); opacity: 0; }
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    background: var(--card);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    font-size: 0.9em;
  }

  /* ── MODAL ──────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(23,17,29,0.62);
    backdrop-filter: blur(7px);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  @media (min-width: 600px) {
    .modal-overlay { align-items: center; }
  }

  .modal {
    background: linear-gradient(155deg, #FFFFFF 0%, #F9F7FA 100%);
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 30px 28px 32px;
    box-shadow: 0 28px 80px rgba(19,12,25,0.26);
    border: 1px solid rgba(255,255,255,0.75);
    animation: slideUp 0.25s ease;
  }
  @media (min-width: 600px) {
    .modal { border-radius: var(--r); }
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-title {
    font-size: 1.1em;
    font-weight: 800;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-close {
    background: var(--bg);
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 1em;
    cursor: pointer;
    color: var(--muted);
  }

  .field { margin-bottom: 14px; }
  .field-label {
    display: block;
    font-size: 0.72em;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .input-wrap { position: relative; }
  .input-prefix {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    font-weight: 600;
    color: var(--muted);
    font-size: 0.9em;
    pointer-events: none;
  }
  input, textarea, select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 0.93em;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, textarea:focus, select:focus {
    border-color: var(--magenta);
    background: white;
  }
  button:focus-visible, .space-card:focus-visible {
    outline: 3px solid rgba(214,0,110,0.38);
    outline-offset: 3px;
  }
  .input-prefixed { padding-left: 30px; }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .emoji-opt {
    aspect-ratio: 1;
    border: 2px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--bg);
    font-size: 1.3em;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .emoji-opt.selected {
    border-color: var(--magenta);
    background: var(--magenta-light);
  }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: var(--r-sm);
    font-size: 0.95em;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: var(--magenta);
    color: white;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 6px;
  }
  .btn:hover { opacity: 0.9; }
  .btn-ghost {
    background: var(--magenta-light);
    color: var(--magenta-dark);
  }
  .btn-silver {
    background: var(--silver);
    color: #2A2C33;
  }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .btn-row .btn { margin-top: 0; }

  .alert {
    margin-top: 12px;
    padding: 12px 16px;
    border-radius: var(--r-sm);
    font-size: 0.85em;
    font-weight: 500;
    display: none;
  }
  .alert-ok  { background: #E4F9EF; color: #00804E; border: 1px solid #B0EDCF; }
  .alert-err { background: #FFF0F1; color: #BF1030; border: 1px solid #FFB8C1; }

  /* ── DETAIL VIEW ────────────────────────── */
  .detail-hero {
    text-align: center;
    padding: 10px 0 20px;
  }
  .detail-emoji {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--magenta-light), var(--silver));
    display: flex; align-items: center; justify-content: center;
    font-size: 2em;
    margin: 0 auto 12px;
  }
  .detail-name { font-size: 1.15em; font-weight: 800; margin-bottom: 4px; }
  .detail-detail { font-size: 0.82em; color: var(--muted); margin-bottom: 16px; }
  .detail-current {
    font-size: 2.2em;
    font-weight: 800;
    color: var(--magenta-dark);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .detail-target {
    font-size: 0.85em;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .detail-meta-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 0.78em;
    color: var(--muted);
    margin-top: 10px;
  }
  .detail-meta-row b { color: var(--text); }

  .tab-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border-radius: var(--r-sm);
    border: 2px solid var(--border);
    background: var(--bg);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85em;
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active {
    border-color: var(--magenta);
    color: var(--magenta-dark);
    background: var(--magenta-light);
  }

  @media (max-width: 560px) {
    .app-header { height: 60px; padding: 0 18px; }
    .main { padding: 20px 14px; gap: 16px; }
    .balance-hero { padding: 27px 24px; }
    .space-card { padding: 18px; }
    .modal { padding: 24px 20px 28px; }
    .space-action { padding: 6px 7px; }
  }
</style>
</head>
<body>

  <header class="app-header">
    <div class="app-logo">nova<span>pay</span></div>
    <div class="avatar">AC</div>
  </header>

  <main class="main">

    <div class="balance-hero">
      <div class="balance-eyebrow">Main Balance</div>
      <div class="balance-amount" id="main-balance-display">£0.00</div>
      <div class="balance-sub">Available to allocate into your Savings Spaces</div>
    </div>

    <div class="section-header">
      <div class="section-title">Savings Spaces</div>
      <button class="btn-new" onclick="openCreateModal()">+ New Space</button>
    </div>

    <div class="spaces-grid" id="spaces-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      No savings spaces yet — create one to start setting money aside toward a goal.
    </div>

  </main>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- CREATE SPACE MODAL -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
      <div class="modal-title">
        <span id="create-modal-title">New Savings Space</span>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('create-modal')">✕</button>
      </div>

      <div class="field">
        <label class="field-label">Choose an icon</label>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>

      <div class="field">
        <label class="field-label">Space name</label>
        <input type="text" id="create-name" placeholder="e.g. Japan Trip">
      </div>

      <div class="field">
        <label class="field-label">Details (optional)</label>
        <textarea id="create-detail" placeholder="What's this space for?"></textarea>
      </div>

      <div class="two-col">
        <div class="field">
          <label class="field-label">Goal amount</label>
          <div class="input-wrap">
            <span class="input-prefix">£</span>
            <input type="number" id="create-goal" class="input-prefixed" placeholder="500" min="0">
          </div>
        </div>
        <div class="field">
          <label class="field-label">Target date</label>
          <input type="date" id="create-date">
        </div>
      </div>

      <div class="field" id="create-start-field">
        <label class="field-label">Starting amount (optional)</label>
        <div class="input-wrap">
          <span class="input-prefix">£</span>
          <input type="number" id="create-start" class="input-prefixed" placeholder="0.00" min="0">
        </div>
      </div>

      <button class="btn" id="create-submit" onclick="createSpace()">Create Space</button>
      <div class="alert alert-err" id="create-error"></div>
    </div>
  </div>

  <!-- DETAIL / TRANSFER MODAL -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
      <div class="modal-title">
        <span id="detail-modal-title">Space Details</span>
        <button class="modal-close" type="button" aria-label="Close" onclick="closeModal('detail-modal')">✕</button>
      </div>

      <div class="detail-hero">
        <div class="detail-emoji" id="detail-emoji"></div>
        <div class="detail-name" id="detail-name"></div>
        <div class="detail-detail" id="detail-detail"></div>
        <div class="detail-current" id="detail-current"></div>
        <div class="detail-target" id="detail-target"></div>
        <div class="progress-track"><div class="progress-fill" id="detail-progress-fill"></div></div>
        <div class="detail-meta-row">
          <div><b id="detail-pct"></b> complete</div>
          <div><b id="detail-days"></b></div>
        </div>
      </div>

      <div class="tab-row">
        <button class="tab-btn active" id="tab-in" onclick="switchTab('in')">Transfer In</button>
        <button class="tab-btn" id="tab-out" onclick="switchTab('out')">Transfer Out</button>
      </div>

      <div class="field">
        <label class="field-label" id="transfer-label">Amount to move from Main Balance</label>
        <div class="input-wrap">
          <span class="input-prefix">£</span>
          <input type="number" id="transfer-amount" class="input-prefixed" placeholder="0.00" min="0">
        </div>
      </div>

      <button class="btn" id="transfer-btn" onclick="doTransfer()">Transfer In</button>

      <div class="btn-row">
        <button class="btn btn-ghost" type="button" onclick="editActiveSpace()">Edit Space</button>
        <button class="btn btn-silver" type="button" onclick="deleteSpace()">Delete Space</button>
      </div>
    </div>
  </div>

  <script>
    const EMOJIS = ['🎯','✈️','🏠','🚗','🎓','💻','📱','🎮','👟','🎁','💍','🏖️','🐶','🎸','📚','🍔','🏋️','🧳','💰','🌱','⚽','🎂'];
    const STORAGE_KEY = 'novapay_savings_spaces';
    const BALANCE_KEY = 'novapay_main_balance';

    let mainBalance = parseFloat(localStorage.getItem(BALANCE_KEY));
    if (isNaN(mainBalance)) mainBalance = 1250.00;

    let spaces = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let selectedEmoji = EMOJIS[0];
    let activeSpaceId = null;
    let activeTab = 'in';
    let editingSpaceId = null;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(spaces));
      localStorage.setItem(BALANCE_KEY, String(mainBalance));
    }

    function formatMoney(n) {
      return '£' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function renderMainBalance() {
      document.getElementById('main-balance-display').textContent = formatMoney(mainBalance);
    }

    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const target = new Date(dateStr + 'T00:00:00');
      const now = new Date();
      now.setHours(0,0,0,0);
      return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
    }

    /* ── TOASTS ───────────────────────────── */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2900);
    }

    /* ── MONTHLY SAVINGS NEEDED ───────────── */
    function monthlyNeeded(space) {
      const remaining = space.goal - space.current;
      const days = daysUntil(space.targetDate);
      if (remaining <= 0 || days === null || days <= 0) return null;
      const months = Math.max(days / 30.44, 1 / 30.44); // avoid divide-by-near-zero
      return remaining / months;
    }

    function renderSpaces() {
      const grid = document.getElementById('spaces-grid');
      const empty = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (spaces.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      spaces.forEach(space => {
        const pct = space.goal > 0 ? Math.min(100, Math.round((space.current / space.goal) * 100)) : 0;
        const met = space.current >= space.goal && space.goal > 0;
        const days = daysUntil(space.targetDate);

        let badge = '';
        if (met) {
          badge = '<div class="space-badge done">Goal reached 🎉</div>';
        } else if (days !== null && days < 0) {
          badge = '<div class="space-badge overdue">Overdue</div>';
        } else if (days !== null) {
          badge = `<div class="space-badge">${days}d left</div>`;
        }

        const monthly = !met ? monthlyNeeded(space) : null;
        const monthlyLine = monthly !== null
          ? `<div class="space-monthly">Save <b>${formatMoney(monthly)}</b>/mo to hit your goal</div>`
          : '';

        const card = document.createElement('div');
        card.className = 'space-card' + (met ? ' goal-met' : '');
        card.onclick = () => openDetailModal(space.id);
        card.setAttribute('role', 'group');
        card.setAttribute('aria-label', `View ${space.name} savings space`);
        card.innerHTML = `
          <div class="space-top">
            <div class="space-emoji">${escapeHtml(space.emoji)}</div>
            <div class="space-heading">
              <div class="space-name">${escapeHtml(space.name)}</div>
              <div class="space-detail">${escapeHtml(space.detail || '')}</div>
            </div>
          </div>
          <div class="space-amounts">
            <div class="space-current">${formatMoney(space.current)}</div>
            <div class="space-target">of ${formatMoney(space.goal)}</div>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="space-footer">
            <span class="space-pct">${pct}%</span>
            ${badge}
          </div>
          ${monthlyLine}
        `;
        const actions = document.createElement('div');
        actions.className = 'space-actions';
        [['Edit', 'space-action', () => openEditModal(space.id)],
          ['Delete', 'space-action delete', () => deleteSpace(space.id)]].forEach(([label, className, action]) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = className;
          button.textContent = label;
          button.setAttribute('aria-label', `${label} ${space.name}`);
          button.onclick = event => {
            event.stopPropagation();
            action();
          };
          actions.appendChild(button);
        });
        card.querySelector('.space-top').appendChild(actions);
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /* ── CREATE MODAL ─────────────────────── */
    function buildEmojiGrid() {
      const grid = document.getElementById('emoji-grid');
      grid.innerHTML = '';
      EMOJIS.forEach(e => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-opt' + (e === selectedEmoji ? ' selected' : '');
        btn.textContent = e;
        btn.setAttribute('aria-label', e);
        btn.setAttribute('aria-pressed', e === selectedEmoji);
        btn.onclick = () => {
          selectedEmoji = e;
          buildEmojiGrid();
        };
        grid.appendChild(btn);
      });
    }

    function openCreateModal() {
      editingSpaceId = null;
      selectedEmoji = EMOJIS[0];
      document.getElementById('create-name').value = '';
      document.getElementById('create-detail').value = '';
      document.getElementById('create-goal').value = '';
      document.getElementById('create-date').value = '';
      document.getElementById('create-start').value = '';
      document.getElementById('create-start-field').style.display = '';
      document.getElementById('create-modal-title').textContent = 'New Savings Space';
      document.getElementById('create-submit').textContent = 'Create Space';
      document.getElementById('create-error').style.display = 'none';
      buildEmojiGrid();
      document.getElementById('create-modal').classList.add('open');
    }

    function editActiveSpace() {
      const id = activeSpaceId;
      closeModal('detail-modal');
      openEditModal(id);
    }

    function openEditModal(id) {
      const space = spaces.find(item => item.id === id);
      if (!space) return;
      editingSpaceId = id;
      selectedEmoji = space.emoji;
      document.getElementById('create-name').value = space.name;
      document.getElementById('create-detail').value = space.detail || '';
      document.getElementById('create-goal').value = space.goal;
      document.getElementById('create-date').value = space.targetDate || '';
      document.getElementById('create-start-field').style.display = 'none';
      document.getElementById('create-modal-title').textContent = 'Edit Savings Space';
      document.getElementById('create-submit').textContent = 'Save Changes';
      document.getElementById('create-error').style.display = 'none';
      buildEmojiGrid();
      document.getElementById('create-modal').classList.add('open');
    }

    function createSpace() {
      const name = document.getElementById('create-name').value.trim();
      const detail = document.getElementById('create-detail').value.trim();
      const goal = parseFloat(document.getElementById('create-goal').value);
      const targetDate = document.getElementById('create-date').value;
      let start = parseFloat(document.getElementById('create-start').value);
      if (isNaN(start) && !editingSpaceId) start = 0;

      const errorEl = document.getElementById('create-error');
      errorEl.style.display = 'none';

      if (!name) {
        errorEl.textContent = 'Please give your space a name.';
        errorEl.style.display = 'block';
        return;
      }
      if (!Number.isFinite(goal) || goal <= 0) {
        errorEl.textContent = 'Please enter a goal amount greater than £0.';
        errorEl.style.display = 'block';
        return;
      }
      if (!editingSpaceId && (!Number.isFinite(start) || start < 0)) {
        errorEl.textContent = 'Starting amount cannot be less than £0.';
        errorEl.style.display = 'block';
        return;
      }
      if (!editingSpaceId && start > mainBalance) {
        errorEl.textContent = 'Starting amount cannot exceed your main balance.';
        errorEl.style.display = 'block';
        return;
      }

      if (editingSpaceId) {
        const space = spaces.find(item => item.id === editingSpaceId);
        if (!space) return;
        Object.assign(space, { emoji: selectedEmoji, name, detail, goal, targetDate });
      } else {
        mainBalance -= start;
        spaces.push({
          id: 'space_' + Date.now(),
          emoji: selectedEmoji,
          name,
          detail,
          goal,
          current: start,
          targetDate,
          createdAt: new Date().toISOString()
        });
      }

      saveState();
      renderMainBalance();
      renderSpaces();
      if (editingSpaceId && activeSpaceId === editingSpaceId &&
          document.getElementById('detail-modal').classList.contains('open')) {
        renderDetailModal();
      }
      showToast(editingSpaceId ? `"${name}" updated.` : `"${name}" created!`, 'ok');
      closeModal('create-modal');
      editingSpaceId = null;
    }

    /* ── DETAIL / TRANSFER MODAL ──────────── */
    function openDetailModal(id) {
      activeSpaceId = id;
      activeTab = 'in';
      renderDetailModal();
      document.getElementById('detail-modal').classList.add('open');
    }

    function getActiveSpace() {
      return spaces.find(s => s.id === activeSpaceId);
    }

    function renderDetailModal() {
      const space = getActiveSpace();
      if (!space) return;

      const pct = space.goal > 0 ? Math.min(100, Math.round((space.current / space.goal) * 100)) : 0;
      const days = daysUntil(space.targetDate);

      document.getElementById('detail-emoji').textContent = space.emoji;
      document.getElementById('detail-name').textContent = space.name;
      document.getElementById('detail-detail').textContent = space.detail || 'No details added.';
      document.getElementById('detail-current').textContent = formatMoney(space.current);
      document.getElementById('detail-target').textContent = 'Goal: ' + formatMoney(space.goal);
      document.getElementById('detail-progress-fill').style.width = pct + '%';
      document.getElementById('detail-pct').textContent = pct + '%';

      let daysText = 'No date set';
      if (days !== null) {
        daysText = days < 0 ? Math.abs(days) + ' days overdue' : days + ' days left';
      }
      document.getElementById('detail-days').textContent = daysText;

      document.getElementById('transfer-amount').value = '';
      switchTab('in');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-in').classList.toggle('active', tab === 'in');
      document.getElementById('tab-out').classList.toggle('active', tab === 'out');
      document.getElementById('transfer-label').textContent =
        tab === 'in' ? 'Amount to move from Main Balance' : 'Amount to move back to Main Balance';
      document.getElementById('transfer-btn').textContent =
        tab === 'in' ? 'Transfer In' : 'Transfer Out';
    }

    function doTransfer() {
      const space = getActiveSpace();
      if (!space) return;

      const amount = parseFloat(document.getElementById('transfer-amount').value);

      if (isNaN(amount) || amount <= 0) {
        showToast('Enter a valid amount greater than £0.', 'err');
        return;
      }

      if (activeTab === 'in') {
        if (amount > mainBalance) {
          showToast('Insufficient main balance for this transfer.', 'err');
          return;
        }
        mainBalance -= amount;
        space.current += amount;
        showToast(`Transferred ${formatMoney(amount)} into "${space.name}".`, 'ok');
      } else {
        if (amount > space.current) {
          showToast('Insufficient balance in this space.', 'err');
          return;
        }
        space.current -= amount;
        mainBalance += amount;
        showToast(`Transferred ${formatMoney(amount)} back to Main Balance.`, 'ok');
      }

      document.getElementById('transfer-amount').value = '';

      saveState();
      renderMainBalance();
      renderSpaces();
      renderDetailModal();
    }

    function deleteSpace(id = activeSpaceId) {
      const space = spaces.find(item => item.id === id);
      if (!space) return;
      if (!confirm(`Delete "${space.name}"? Any remaining balance (${formatMoney(space.current)}) will be returned to your Main Balance.`)) {
        return;
      }
      mainBalance += space.current;
      spaces = spaces.filter(s => s.id !== space.id);
      saveState();
      renderMainBalance();
      renderSpaces();
      if (activeSpaceId === id) closeModal('detail-modal');
      if (editingSpaceId === id) closeModal('create-modal');
      showToast(`"${space.name}" deleted — balance returned to Main.`, 'info');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // Close modal when clicking outside content
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('open');
      });
    });

    // Init
    renderMainBalance();
    renderSpaces();
  </script>

</body>
</html>
